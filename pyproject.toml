[project]
name = "acme-ap-agents"
version = "0.1.0"
description = "Multi-agent invoice processing for Acme Corp accounts payable, built on Grok and LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.24",
    "openai>=3.59.0",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"ui/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
