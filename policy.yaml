approval_threshold: 10000
near_threshold_pct: 5
total_tolerance: 0.01
price_tolerance_pct: 5
currencies: [USD]
max_rounds: 2
payment_attempts: 3

findings:
  DATA_INTEGRITY:    {severity: reject, disposition: void}
  DUPLICATE:         {severity: reject, disposition: void}
  FRAUD_SIGNALS:     {severity: reject, disposition: void}
  NEEDS_MODEL:       {severity: reject, disposition: manual_entry}
  UNREADABLE:        {severity: reject, disposition: return_to_vendor}
  REVISION_CONFLICT: {severity: reject, disposition: return_to_vendor}
  STOCK_EXCEEDED:    {severity: reject, disposition: return_to_vendor}
  UNKNOWN_ITEM:      {severity: reject, disposition: return_to_vendor}
  TOTAL_MISMATCH:    {severity: reject, disposition: return_to_vendor}
  CURRENCY:          {severity: reject, disposition: return_to_vendor}
  PRICE_VARIANCE:    {severity: warn}
  DATE_ODDITY:       {severity: warn}
  NEW_VENDOR:        {severity: warn}
  OCR_CORRECTED:     {severity: info}
  NEAR_THRESHOLD:    {severity: info}
